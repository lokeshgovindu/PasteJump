<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Dependency diagram: PasteJump.App depends on Interop, Import and Core; Interop and Import depend on Core; Core depends on nothing, and the Core to Interop boundary is crossed only by four interfaces.">
  <title>PasteJump project dependencies, and the interfaces that cross the Core boundary</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DCE7ED"/>
    </marker>
  </defs>

  <!-- The panel is the same in light and dark: a drafting table. -->
  <rect x="0" y="0" width="900" height="500" fill="#0D151B"/>

  <!-- App -->
  <rect x="70" y="30" width="790" height="96" rx="3" fill="#16222B" stroke="#3E6273" stroke-width="1.5"/>
  <text x="90" y="60" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#DCE7ED">PasteJump.App</text>
  <text x="90" y="82" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#8CA6B4">net10.0-windows &#183; WPF. Composition root, tray, overlay, history, settings, dialogs.</text>
  <text x="90" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#8CA6B4">App.Compose() &#183; PasteJumpPasteHost &#183; ThemeManager &#183; TrayMenuBuilder</text>

  <!-- Interop -->
  <rect x="150" y="176" width="345" height="96" rx="3" fill="#16222B" stroke="#3E6273" stroke-width="1.5"/>
  <text x="170" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#DCE7ED">PasteJump.Interop</text>
  <text x="170" y="228" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#8CA6B4">net10.0-windows &#183; the Win32 half.</text>
  <text x="170" y="250" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#8CA6B4">hook &#183; clipboard &#183; SendInput &#183; tray &#183; hotkey</text>

  <!-- Import -->
  <rect x="525" y="176" width="335" height="96" rx="3" fill="#16222B" stroke="#3E6273" stroke-width="1.5"/>
  <text x="545" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#DCE7ED">PasteJump.Import</text>
  <text x="545" y="228" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#8CA6B4">One-time Clipjump 12.x migration.</text>
  <text x="545" y="250" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#8CA6B4">.avc clip files &#183; idempotent by natural key</text>

  <!-- the seam -->
  <line x1="70" y1="322" x2="860" y2="322" stroke="#A8451A" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="860" y="313" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#E8845A">THE SEAM &#8212; CROSSED ONLY BY INTERFACES</text>

  <rect x="70" y="336" width="176" height="30" rx="15" fill="#241812" stroke="#A8451A" stroke-width="1.2"/>
  <text x="158" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#E8845A">IClipboardAccess</text>
  <rect x="258" y="336" width="140" height="30" rx="15" fill="#241812" stroke="#A8451A" stroke-width="1.2"/>
  <text x="328" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#E8845A">IPasteSender</text>
  <rect x="410" y="336" width="212" height="30" rx="15" fill="#241812" stroke="#A8451A" stroke-width="1.2"/>
  <text x="516" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#E8845A">IForegroundWindowInfo</text>
  <rect x="634" y="336" width="96" height="30" rx="15" fill="#241812" stroke="#A8451A" stroke-width="1.2"/>
  <text x="682" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#E8845A">IClock</text>

  <!-- Core -->
  <rect x="70" y="386" width="790" height="96" rx="3" fill="#0F2B2E" stroke="#2E7D88" stroke-width="1.5"/>
  <text x="90" y="416" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#7FD3DE">PasteJump.Core</text>
  <text x="90" y="438" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#8CA6B4">net10.0 &#8212; deliberately not -windows. No WPF, no Win32, no message loop.</text>
  <text x="90" y="460" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#8CA6B4">PasteModeController &#183; CaptureService &#183; ClipStore &#183; ClipboardPaster &#183; settings &#183; themes</text>

  <!-- arrows -->
  <line x1="300" y1="126" x2="300" y2="174" stroke="#DCE7ED" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="660" y1="126" x2="660" y2="174" stroke="#DCE7ED" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="300" y1="272" x2="300" y2="384" stroke="#DCE7ED" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="660" y1="272" x2="660" y2="384" stroke="#DCE7ED" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 70 78 L 32 78 L 32 434 L 68 434" fill="none" stroke="#DCE7ED" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="316" y="155" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8CA6B4">references</text>
  <text x="676" y="155" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8CA6B4">references</text>
  <text x="46" y="256" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8CA6B4" transform="rotate(-90 46 256)">references</text>
</svg>
